<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermal Receipt Tester</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: #1a1a1a; margin-top: 0; border-bottom: 2px solid #f0f2f5; padding-bottom: 15px; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #4b5563; }
        input[type="number"], select, input[type="file"] { width: 100%; padding: 0.8rem; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .helper-text { font-size: 0.85rem; color: #6b7280; margin-top: 0.4rem; }
        button { background-color: #10b981; color: white; border: none; padding: 1rem 2rem; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #059669; }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; }
        #preview-container { margin: 1.5rem 0; border: 2px dashed #e5e7eb; border-radius: 8px; padding: 10px; min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fafafa; }
        #preview-img { max-width: 100%; height: auto; border: 1px solid #eee; display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        #status { margin-top: 1.5rem; padding: 1rem; border-radius: 6px; display: none; font-weight: 500; }
        .success { background-color: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
        .error { background-color: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        .debug-section { margin-top: 2rem; background: #1f2937; color: #f9fafb; padding: 1rem; border-radius: 6px; }
        pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="card">
    <h1>Thermal Receipt Printer</h1>
    
    <div class="form-group">
        <label>Upload Image</label>
        <input type="file" id="imageInput" accept="image/png, image/jpeg, image/gif, image/bmp">
        <p class="helper-text">High-contrast images (logos, QR codes) work best.</p>
    </div>

    <div id="preview-container">
        <span id="placeholder">Image Preview (Aspect Ratio Maintained)</span>
        <img id="preview-img" src="" alt="Preview">
    </div>

    <div class="form-group">
        <label>Paper Width (mm)</label>
        <select id="width">
            <option value="80">80mm (Standard)</option>
            <option value="58">58mm (Small/Mobile)</option>
        </select>
        <p class="helper-text">Height will adjust automatically to fit the image.</p>
    </div>

    <button id="printBtn">Print to Receipt</button>

    <div id="status"></div>

    <div id="debug-panel" style="display:none;" class="debug-section">
        <label style="color: #9ca3af; font-size: 0.75rem;">SERVER RESPONSE</label>
        <pre id="responseOutput"></pre>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const previewImg = document.getElementById('preview-img');
    const placeholder = document.getElementById('placeholder');
    const printBtn = document.getElementById('printBtn');
    const statusDiv = document.getElementById('status');
    const responseOutput = document.getElementById('responseOutput');
    const debugPanel = document.getElementById('debug-panel');

    let base64Image = '';

    // Convert image to Base64 for the API
    imageInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                base64Image = event.target.result;
                previewImg.src = base64Image;
                previewImg.style.display = 'block';
                placeholder.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    });

    printBtn.addEventListener('click', async () => {
        const paperWidth = parseInt(document.getElementById('width').value);

        if (!base64Image) {
            updateStatus('Please select an image first.', 'error');
            return;
        }

        printBtn.disabled = true;
        updateStatus('Processing print job...', '');

        try {
            const response = await fetch('http://localhost:9000/api/v2/print/image', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    image: base64Image,
                    width: paperWidth
                })
            });

            const data = await response.json();
            
            debugPanel.style.display = 'block';
            responseOutput.textContent = JSON.stringify(data, null, 2);

            if (response.ok) {
                const info = data.mode === 'virtual' ? ` (Debug file created: ${data.file})` : '';
                updateStatus(`Successfully sent to printer! Mode: ${data.mode}${info}`, 'success');
            } else {
                updateStatus(`Printer Error: ${data.error || 'Server rejected request'}`, 'error');
            }
        } catch (err) {
            updateStatus(`Connection Error: Ensure the server is reachable.`, 'error');
        } finally {
            printBtn.disabled = false;
        }
    });

    function updateStatus(msg, type) {
        statusDiv.textContent = msg;
        statusDiv.className = type;
        statusDiv.style.display = msg ? 'block' : 'none';
    }
</script>

</body>
</html>
